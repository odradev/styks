[workspace]
members = [
    "styks-blocky-parser",
    "styks-cli",
    "styks-contracts",
    "styks-core",
    "styks-make-parser",
]
resolver = "2"

[workspace.dependencies]
odra = "2.9.0"
odra-test = "2.9.0"
odra-build = "2.9.0"
odra-cli = "2.9.0"
odra-modules = "2.9.0"

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
