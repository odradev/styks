[package]
name = "styks-make-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
k256 = { version = "0.13.4", features = ["ecdsa", "sha256", "alloc"], default-features = false }
sha3 = { version = "0.10.8", default-features = false }
ethabi = { version = "18.0.0", default-features = false }
serde = { version = "1.0", default-features = false }
serde-json-wasm = {version = "1", default-features = false }
casper-types = { version = "6.1.0", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, optional = true }
time = { version = "0.3", default-features = false, features = ["parsing", "alloc"] }

[features]
default = ["std"]
test-utils = ["std"]
std = ["dep:hex" ]